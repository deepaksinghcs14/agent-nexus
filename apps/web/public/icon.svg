<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="#534AB7"/>
  <!-- Agent node graph: center dot + three orbiting dots + connecting lines -->
  <circle cx="16" cy="16" r="3" fill="white"/>
  <!-- Top node -->
  <circle cx="16" cy="7" r="2" fill="white" opacity="0.85"/>
  <line x1="16" y1="9" x2="16" y2="13" stroke="white" stroke-width="1.2" stroke-opacity="0.6"/>
  <!-- Bottom-left node -->
  <circle cx="8.5" cy="22" r="2" fill="white" opacity="0.85"/>
  <line x1="10" y1="21" x2="14" y2="18" stroke="white" stroke-width="1.2" stroke-opacity="0.6"/>
  <!-- Bottom-right node -->
  <circle cx="23.5" cy="22" r="2" fill="white" opacity="0.85"/>
  <line x1="22" y1="21" x2="18" y2="18" stroke="white" stroke-width="1.2" stroke-opacity="0.6"/>
</svg>
