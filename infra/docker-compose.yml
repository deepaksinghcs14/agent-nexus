services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: agent_nexus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d agent_nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: agent-nexus-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://nexus:nexus@postgres:5432/agent_nexus?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-32-chars-minimum!!}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-dev-32-bytes-minimum!!}
      PORT: 8080
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_PATH: /data/files
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      PUBLIC_API_URL: http://localhost:8080
      PUBLIC_APP_URL: http://localhost:3000
      WHATSAPP_ADAPTER_URL: http://127.0.0.1:18901
      WHATSAPP_AUTH_ROOT: /data/whatsapp-auth
      EMBED_OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: nomic-embed-text
      # ── Jira→PR pipeline ──
      RUNNER_URL: http://runner:8092
      RUNNER_CALLBACK_SECRET: ${RUNNER_CALLBACK_SECRET:-dev-runner-secret-change-me}
      SESSION_CALLBACK_URL: http://api:8080
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
    ports:
      - "8080:8080"
    volumes:
      - api_storage:/data/files
      - whatsapp_auth:/data/whatsapp-auth
      # Corporate TLS interception: drop the gateway root CA (PEM) into
      # infra/certs/ and it is trusted at container start (see start-api.sh).
      - ./certs:/corp-certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    build:
      context: ../services/ollama
      dockerfile: Dockerfile
    container_name: agent-nexus-ollama
    restart: unless-stopped
    environment:
      PORT: 11434
      EMBED_MODEL: nomic-embed-text
    volumes:
      # Model cache — nomic-embed-text (~274 MB) is pulled on first start and
      # reused across restarts.
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/"]
      interval: 10s
      timeout: 5s
      retries: 30

  runner:
    build:
      context: ../services/runner
      dockerfile: Dockerfile
    container_name: agent-nexus-runner
    restart: unless-stopped
    environment:
      PORT: 8092
      # stub = simulated sessions (works with no credentials); set to "claude"
      # plus GITHUB_TOKEN and ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN)
      # for real Claude Code repo sessions.
      RUNNER_EXECUTOR: ${RUNNER_EXECUTOR:-stub}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      MAX_TURNS: ${RUNNER_MAX_TURNS:-50}
      SESSION_TIMEOUT_MIN: ${RUNNER_SESSION_TIMEOUT_MIN:-120}
      WORK_DIR: /data/sessions
      # Corporate TLS interception (e.g. Cloudflare Zero Trust): drop your
      # gateway's root CA at infra/certs/corp-ca.pem and set
      # RUNNER_EXTRA_CA=/corp-certs/corp-ca.pem in infra/.env.
      RUNNER_EXTRA_CA: ${RUNNER_EXTRA_CA:-}
    volumes:
      - runner_sessions:/data/sessions
      - ./certs:/corp-certs:ro

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: agent-nexus-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  api_storage:
  whatsapp_auth:
  runner_sessions:
  ollama_models:
