name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  api:
    name: Go build & vet
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: Build
        working-directory: services/api
        run: go build ./...
      - name: Vet
        working-directory: services/api
        run: go vet ./...
      - name: Test
        working-directory: services/api
        env:
          # Drives the agent-loop integration suite (loop_test.go) against the
          # pgvector service above; the suite fails rather than skips in CI.
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nexus_test?sslmode=disable
        run: go test ./...
      - name: golangci-lint
        working-directory: services/api
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./...
      - name: govulncheck
        working-directory: services/api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  web:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Lint
        working-directory: apps/web
        run: npm run lint --if-present
